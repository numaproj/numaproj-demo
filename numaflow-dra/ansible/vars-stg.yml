# All version values in this file MUST be written WITHOUT the "v" prefix.
# The playbooks add "v" where needed (e.g., repository URLs, git tags).

ubuntu_common:
  timezone: Asia/Tokyo

# kubernetes-cluster.yml
# repo_ver: apt repository minor version (X.Y only, not X.Y.Z).
#   e.g., 1.35 — the repository hosts all patch releases in this series.
# k8s_ver, crio_ver: apt package version with the release suffix (X.Y.Z-S.S).
#   e.g., 1.35.3-1.1 — apt requires the exact version string including suffix.
kubeadm_install:
  repo_ver: 1.36
  k8s_ver: 1.36.4-1.1
  crio_ver: 1.36.4-1.1

# kubeadm_init_join.k8s_ver: Kubernetes version without the release suffix.
#   e.g., 1.35.3 — passed to "kubeadm init --kubernetes-version".
kubeadm_init_join:
  k8s_ver: 1.36.4
  # pod_network_cidr: A CIDR block passed to kubeadm init --pod-network-cidr.
  # It can be within any of IPv4 private address ranges but MUST NOT overlap
  # any of the host networks [1].
  #
  # Calico will automatically detect which IP address range to use for pod IPs
  # based on the value provided via --pod-network-cidr [2], so we do not need
  # to edit CALICO_IPV4POOL_CIDR in the calico.yaml.
  #
  # [1] https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/#pod-network
  # [2] https://github.com/kubernetes/website/commit/c0f669ab681901f5fda6771b42768781495c12c6
  pod_network_cidr: 10.244.0.0/16

calico:
  # https://docs.tigera.io/calico/latest/getting-started/kubernetes/requirements#supported-versions
  calico_ver: 3.32.1

dra_driver_nvidia_gpu:
  nfd_ver: 0.19.0
  dra_driver_nvidia_gpu_ver: 0.5.0

numaflow_install:
  numaflow_version: 1.8.3

kube_prometheus:
  # See the compatibility section [1] and tags [2] to decide your
  # version of kube-prometheus stack being installed.
  # [1] https://github.com/prometheus-operator/kube-prometheus?tab=readme-ov-file#compatibility
  # [2] https://github.com/prometheus-operator/kube-prometheus/tags
  kube_prometheus_ver: 0.18.0
