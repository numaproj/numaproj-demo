- name: Install ubuntu-desktop-minimal
  become: true
  ansible.builtin.apt:
    name:
      - ubuntu-desktop-minimal

# graphical.target means runlevel 5
- name: Get the current default target
  ansible.builtin.command: systemctl get-default
  register: demo_remote_desktop_target
  changed_when: false

- name: Change the default target to graphical.target if not yet
  when: demo_remote_desktop_target.stdout != "graphical.target"
  become: true
  ansible.builtin.command: systemctl set-default graphical.target
  notify:
    - Reboot machine
