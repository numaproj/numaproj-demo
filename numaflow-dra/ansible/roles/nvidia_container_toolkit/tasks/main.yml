# See https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
- name: Add GPG key for libnvidia-container repository
  become: true
  ansible.builtin.apt_key:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    keyring: /etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg

- name: Add libnvidia-container repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /"
    filename: nvidia-container-toolkit

- name: Install nvidia-container-toolkit
  become: true
  ansible.builtin.apt:
    update_cache: true
    name: nvidia-container-toolkit
