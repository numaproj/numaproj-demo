# This playbook automates the section "1. Prerequisites" of the
# AICP-Numaflow-PoC README [1].
#
# [1] https://github.com/numaproj/numaproj-demo/blob/main/numaflow-dra/README.md
#
---
- name: Setup Ubuntu 24.04
  hosts: all
  pre_tasks:
    # Remove old apt_key/apt_repository artifacts that conflict with
    # the new deb822_repository entries.  Safe to delete once every
    # host has been reprovisioned with deb822.
    - name: Remove legacy apt_key keyrings
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - /etc/apt/keyrings/cri-o-apt-keyring.gpg
        - /etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg
        - /etc/apt/keyrings/helm-keyring.gpg
    - name: Remove legacy apt_repository sources
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/sources.list.d/cri-o.list
        - /etc/apt/sources.list.d/nvidia-container-toolkit.list
        - /etc/apt/sources.list.d/helm.list
  roles:
    - ubuntu_2404
    - ubuntu_common

- name: Setup Kubernetes Cluster
  import_playbook: playbooks/kubernetes-cluster.yml
- name: Setup NVIDIA GPU Support
  import_playbook: playbooks/nvidia-gpu-support.yml
- name: Setup Dyanamic Resource Allocation
  import_playbook: playbooks/dra-driver-nvidia-gpu.yml
- name: Setup Numaflow
  import_playbook: playbooks/numaflow.yml
- name: Setup Numaflow-DRA Tools
  import_playbook: playbooks/numaflow-dra-tools.yml

- name: Setup monitoring system for Numaflow
  import_playbook: playbooks/monitor.yml
- name: Setup remote desktop (VNC) for demo
  import_playbook: playbooks/demo-remote-desktop.yml
- name: Setup Grafana dashboard for demo
  import_playbook: playbooks/demo-grafana-dashboard.yml
